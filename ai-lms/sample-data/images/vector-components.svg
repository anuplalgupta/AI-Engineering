<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" width="360" height="270" role="img" aria-labelledby="t d">
  <title id="t">A vector and its components</title>
  <desc id="d">Vector A from the origin at angle theta above the x axis, with its horizontal component A x and vertical component A y forming a right-angled triangle.</desc>
  <defs>
    <marker id="head-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="head-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="360" height="270" fill="#ffffff"/>

  <!-- axes -->
  <line x1="30" y1="220" x2="335" y2="220" stroke="#6b7280" stroke-width="1.5" marker-end="url(#head-axis)"/>
  <line x1="60" y1="250" x2="60" y2="25" stroke="#6b7280" stroke-width="1.5" marker-end="url(#head-axis)"/>
  <text x="340" y="238" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="16" fill="#374151" text-anchor="end">x</text>
  <text x="44" y="34" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="16" fill="#374151">y</text>
  <text x="46" y="238" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#374151">O</text>

  <!-- components -->
  <line x1="60" y1="220" x2="280" y2="220" stroke="#1d4ed8" stroke-width="3" marker-end="url(#head-blue)"/>
  <line x1="280" y1="220" x2="280" y2="90" stroke="#b91c1c" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#head-red)"/>
  <!-- right-angle mark -->
  <path d="M266 220 L266 206 L280 206" fill="none" stroke="#6b7280" stroke-width="1.5"/>

  <!-- the vector -->
  <line x1="60" y1="220" x2="280" y2="90" stroke="#1f2937" stroke-width="3.5" marker-end="url(#head-dark)"/>

  <!-- angle -->
  <path d="M108 220 A48 48 0 0 0 101.3 195.6" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="116" y="210" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#374151">θ</text>

  <!-- labels -->
  <text x="150" y="138" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="20" fill="#1f2937">A</text>
  <line x1="148" y1="119" x2="164" y2="119" stroke="#1f2937" stroke-width="1.5" marker-end="url(#head-dark)"/>

  <text x="170" y="246" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#1d4ed8" text-anchor="middle">A<tspan dy="4" font-size="12">x</tspan><tspan dy="-4"> = A cos θ</tspan></text>
  <text x="290" y="150" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#b91c1c">A<tspan dy="4" font-size="12">y</tspan></text>
  <text x="290" y="172" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#b91c1c">= A sin θ</text>
</svg>
